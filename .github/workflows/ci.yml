name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: test · build · audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Canary (dry, offline)
        run: npm run canary

      - name: Audit
        run: npm audit --audit-level=high
